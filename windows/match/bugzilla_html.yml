# Copy a Bugzilla bug URL and type ":bughtml" to get an HTML link.
# Windows version of match/bugzilla_html.yml.
# See windows/match/gh_issue_link.yml for why this file uses a "script" var.
matches:
  - trigger: ":bughtml"
    html: "{{output}}"
    vars:
      - name: output
        type: script
        params:
          args:
            - uv
            - run
            - --quiet
            - --script
            - "%CONFIG%/scripts/bugzilla_link.py"
            - --html
          ignore_error: true
