# Copy a Zendesk ticket URL and type ":zdhtml" to get an HTML link.
# Windows version of match/zd_ticket_html.yml. On Windows, espanso runs "shell" vars in
# PowerShell, so this file uses a "script" var, which runs uv directly.
# Espanso replaces %CONFIG% in "script" args. "ignore_error: true" makes
# espanso insert the error message, because the script exits with code 1 on errors.
matches:
  - trigger: ":zdhtml"
    html: "{{output}}"
    vars:
      - name: output
        type: script
        params:
          args:
            - uv
            - run
            - --quiet
            - --script
            - "%CONFIG%/scripts/zd_ticket_link.py"
            - --html
          ignore_error: true
